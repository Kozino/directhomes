<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · House Management</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--muted:#6b7686;--line:#e3e7ee;--accent:#0f766e;--bad:#b42318;--warn:#b54708;--ok:#067647}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
#login{max-width:360px;margin:12vh auto;background:var(--card);padding:28px;border:1px solid var(--line);border-radius:12px}
#app{display:none;min-height:100vh}
nav{width:220px;background:#12332f;color:#d7ece8;padding:18px 12px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:16px;margin:0 8px 14px;color:#fff}
nav button{background:none;border:0;color:inherit;text-align:left;padding:9px 12px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:#1d4d47;color:#fff}
nav .sp{flex:1}
main{margin-left:220px;padding:28px;max-width:1100px}
h2{margin:0 0 16px}h3{margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.cards b{display:block;font-size:26px}.muted{color:var(--muted)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:12px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}tr:last-child td{border:0}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;max-width:100%}
button.btn,form button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
button.sm{padding:4px 10px;font-size:13px}button.ghost{background:#fff;color:var(--accent)}button.danger{background:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.b{font-size:12px;padding:2px 8px;border-radius:99px;background:#eef1f5}
.b.ACTIVE,.b.VERIFIED,.b.APPROVED{background:#dcfae6;color:var(--ok)}.b.PENDING,.b.SUSPENDED{background:#fef0c7;color:var(--warn)}.b.BANNED,.b.REJECTED{background:#fee4e2;color:var(--bad)}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.docs img{width:100%;border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;bottom:20px;right:20px;background:#12332f;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
@media(max-width:760px){nav{position:static;width:auto;flex-direction:row;flex-wrap:wrap}nav h1{width:100%}main{margin:0;padding:16px}}
</style>
</head>
<body>
<div id="login">
  <h2>Admin sign in</h2>
  <form data-form="login" class="row" style="flex-direction:column;align-items:stretch">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button>Sign in</button>
  </form>
</div>
<div id="app">
  <nav id="nav">
    <h1>🏠 House Admin</h1>
    <button data-v="dashboard">Overview</button>
    <button data-v="kyc">Verification queue</button>
    <button data-v="properties">Property approvals</button>
    <button data-v="accounts">Payment accounts</button>
    <button data-v="disputes">Payment disputes</button>
    <button data-v="users">Users</button>
    <button data-v="features">Features</button>
    <button data-v="unitTypes">Unit types</button>
    <button data-v="locations">Locations</button>
    <button data-v="tiers">Onboarding fees</button>
    <button data-v="audit">Audit log</button>
    <span class="sp"></span>
    <button id="logout">Sign out</button>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
